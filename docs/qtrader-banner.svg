<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8fffd"/>
      <stop offset="1" stop-color="#e8fff8"/>
    </linearGradient>

    <linearGradient id="crystalLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fff1"/>
      <stop offset="1" stop-color="#55d7b2"/>
    </linearGradient>

    <linearGradient id="crystalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#176779"/>
      <stop offset="1" stop-color="#103945"/>
    </linearGradient>

    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30c6aa"/>
      <stop offset="1" stop-color="#f6ae4b"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#1d766c" flood-opacity="0.18"/>
    </filter>

    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="#7bcdbc" stroke-width="1" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="405" fill="url(#background)"/>
  <rect x="475" width="725" height="405" fill="url(#grid)"/>

  <!-- Soft chart-area glow -->
  <ellipse cx="910" cy="205" rx="320" ry="210" fill="#b9f4df" opacity="0.16"/>

  <!-- Branding -->
  <g transform="translate(82 101)">
    <text x="0" y="85"
          font-family="Inter, Arial, sans-serif"
          font-size="108"
          font-weight="650"
          letter-spacing="-5"
          fill="#172731">QTrader</text>

    <text x="5" y="130"
          font-family="Inter, Arial, sans-serif"
          font-size="23"
          font-weight="500"
          letter-spacing="1.5"
          fill="#3f6470">AI-POWERED QUANTITATIVE TRADING PLATFORM</text>

    <text x="5" y="169"
          font-family="Inter, Arial, sans-serif"
          font-size="18"
          fill="#6c8790">Research · Strategy · Backtesting · Execution</text>

    <g transform="translate(5 202)">
      <rect width="50" height="4" rx="2" fill="#35c9a8"/>
      <rect x="58" width="23" height="4" rx="2" fill="#f5ad4c"/>
      <rect x="89" width="12" height="4" rx="2" fill="#35c9a8" opacity="0.45"/>
    </g>
  </g>

  <!-- Network connections -->
  <g fill="none" stroke="#55bfa9" stroke-width="1.3" opacity="0.58">
    <path d="M612 50L687 100L650 170L716 228L662 311"/>
    <path d="M687 100L785 69L843 115L930 74L1018 108L1095 56"/>
    <path d="M716 228L806 187L881 225L969 181L1058 232L1122 183"/>
    <path d="M662 311L754 341L836 305L922 349L1008 296L1080 347"/>
    <path d="M843 115L881 225L930 74"/>
    <path d="M969 181L1008 296L1058 232"/>
    <path d="M1018 108L969 181L1122 183"/>
  </g>

  <!-- Network nodes -->
  <g>
    <g fill="#4bc5a5">
      <rect x="678" y="91" width="18" height="18" rx="2" transform="rotate(45 687 100)"/>
      <circle cx="785" cy="69" r="7"/>
      <circle cx="716" cy="228" r="6"/>
      <circle cx="836" cy="305" r="6"/>
      <circle cx="1080" cy="347" r="6"/>
    </g>

    <g fill="#f3ae4f">
      <rect x="1087" y="48" width="16" height="16" rx="2" transform="rotate(45 1095 56)"/>
      <circle cx="1058" cy="232" r="8"/>
      <circle cx="1008" cy="296" r="5"/>
    </g>

    <g fill="#ffffff" stroke="#47bea5" stroke-width="4">
      <circle cx="612" cy="50" r="9"/>
      <circle cx="843" cy="115" r="7"/>
      <rect x="1115" y="176" width="14" height="14" rx="2" transform="rotate(45 1122 183)"/>
    </g>
  </g>

  <!-- Candlesticks behind crystal -->
  <g opacity="0.72">
    <g stroke="#2eb99c" stroke-width="2">
      <line x1="680" y1="127" x2="680" y2="208"/>
      <rect x="673" y="146" width="14" height="38" rx="2" fill="#55d4b4" stroke="none"/>

      <line x1="731" y1="102" x2="731" y2="190"/>
      <rect x="724" y="118" width="14" height="46" rx="2" fill="#55d4b4" stroke="none"/>

      <line x1="1085" y1="108" x2="1085" y2="186"/>
      <rect x="1078" y="128" width="14" height="33" rx="2" fill="#55d4b4" stroke="none"/>
    </g>

    <g stroke="#eeaa4c" stroke-width="2">
      <line x1="1035" y1="93" x2="1035" y2="175"/>
      <rect x="1028" y="113" width="14" height="38" rx="2" fill="#f3b559" stroke="none"/>
    </g>
  </g>

  <!-- Central low-poly rising market crystal -->
  <g filter="url(#shadow)">
    <polygon points="805,388 772,266 789,112 837,27 885,91 919,5 973,71 1009,237 994,350 918,405"
             fill="#166276"/>

    <polygon points="789,112 837,27 863,125 817,218"
             fill="url(#crystalLight)"/>

    <polygon points="837,27 919,5 883,102 863,125"
             fill="#cffff0"/>

    <polygon points="919,5 973,71 943,142 883,102"
             fill="#64cfb0"/>

    <polygon points="973,71 1009,237 956,208 943,142"
             fill="#154654"/>

    <polygon points="817,218 863,125 883,102 904,247 850,285"
             fill="#70dab9"/>

    <polygon points="883,102 943,142 956,208 904,247"
             fill="#318f88"/>

    <polygon points="772,266 789,112 817,218 850,285 805,388"
             fill="#1e7280"/>

    <polygon points="805,388 850,285 904,247 918,405"
             fill="#3faaa0"/>

    <polygon points="904,247 956,208 994,350 918,405"
             fill="#246d78"/>

    <polygon points="956,208 1009,237 994,350"
             fill="#113e4c"/>

    <!-- Upward arrow facet -->
    <path d="M823 281L872 254L899 267L944 208"
          fill="none"
          stroke="#9effdf"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.72"/>

    <path d="M930 213L946 205L945 223"
          fill="none"
          stroke="#f6b34e"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)"/>
  </g>

  <!-- Foreground market line -->
  <path d="M638 334L699 320L758 343L818 309L872 322L929 270L976 288L1031 223L1081 248L1147 171"
        fill="none"
        stroke="url(#chartLine)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <g fill="#ffffff" stroke="#42c4a5" stroke-width="3">
    <circle cx="699" cy="320" r="5"/>
    <circle cx="818" cy="309" r="5"/>
    <circle cx="929" cy="270" r="5"/>
    <circle cx="1031" cy="223" r="5"/>
    <circle cx="1147" cy="171" r="5"/>
  </g>

  <circle cx="1031" cy="223" r="8" fill="#f5b24f" stroke="#fff" stroke-width="3" filter="url(#glow)"/>

  <!-- Decorative data marks -->
  <g opacity="0.24" stroke="#42bca4" stroke-width="2">
    <path d="M531 362h45m8 0h17m-70 10h29m8 0h41"/>
    <path d="M1104 110h38m-38 9h26m-26 9h46"/>
    <path d="M1118 286h38m-38 9h24m-24 9h44"/>
  </g>
</svg>